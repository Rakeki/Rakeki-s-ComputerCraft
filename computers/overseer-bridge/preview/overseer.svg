    <text x="176" y="508" fill="#d8ecff">Tunneler-61 <tspan fill="#2fd6a4">⇉</tspan> everyone</text><text x="360" y="508" fill="#fff" font-weight="700">status</text><text x="440" y="508" fill="#7d93ad">state=stuck</text><text x="930" y="508" fill="#4a5d75" text-anchor="end">197 B</text>
