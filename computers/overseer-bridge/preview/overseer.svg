    <text x="176" y="464" fill="#d8ecff">Factory <tspan fill="#ffb02e">→</tspan> Storage</text><text x="360" y="464" fill="#fff" font-weight="700">fill</text><text x="440" y="464" fill="#7d93ad">furnaces=12</text><text x="930" y="464" fill="#4a5d75" text-anchor="end">900 B</text>
