    <path d="M512 338Q492 336 482 324" stroke="#ff6a3d" stroke-width="4" stroke-opacity=".8" filter="url(#glow)"/>
    <path d="M100 300Q120 268 168 268" stroke="#ffb02e" stroke-opacity=".12"/>
    <path d="M128 276Q146 268 158 268" stroke="#ffe45c" stroke-width="3.5" stroke-opacity=".8" filter="url(#glow)"/>
