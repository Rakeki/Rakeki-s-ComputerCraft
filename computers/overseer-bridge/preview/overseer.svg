    <rect x="722" y="174" width="210" height="2" fill="#ffffff" fill-opacity=".08"/><rect x="722" y="174" width="140" height="2" fill="#8cff3f"/>
    <rect x="699" y="193" width="15" height="15" rx="3" fill="none" stroke="#8cff3f" stroke-width="2"/><text x="722" y="198" fill="#fff" font-weight="700">Storage</text><text x="722" y="214" fill="#7d93ad" font-size="9">48 chests · 61% full</text>
    <rect x="886" y="190" width="46" height="14" rx="3" fill="none" stroke="#8cff3f"/><text x="909" y="200" fill="#8cff3f" font-size="7" text-anchor="middle" font-weight="800">SERVING</text>
    <path d="M698 246l8-8 8 8-8 8z" fill="none" stroke="#3fc4ff" stroke-width="2"/><text x="722" y="242" fill="#fff" font-weight="700">Builder-31</text><text x="722" y="258" fill="#7d93ad" font-size="9">fetching stone_bricks</text>
