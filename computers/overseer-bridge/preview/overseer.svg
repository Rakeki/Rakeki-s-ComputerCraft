    <text x="176" y="486" fill="#d8ecff">Miner-23 <tspan fill="#ff6a3d">→</tspan> Mine Control</text><text x="360" y="486" fill="#fff" font-weight="700">progress</text><text x="440" y="486" fill="#7d93ad">mined=412</text><text x="930" y="486" fill="#4a5d75" text-anchor="end">210 B</text>
