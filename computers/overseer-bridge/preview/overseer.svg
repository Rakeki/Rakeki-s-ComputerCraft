  <path d="M0 52H960" stroke="url(#title)" stroke-width="1.5"/>
  <path d="M30 12l12 7v14l-12 7-12-7V19z" fill="none" stroke="#3fe0ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="30" cy="26" r="3.5" fill="#3fe0ff"/>
  <text x="54" y="32" font-family="Orbitron, Verdana, sans-serif" font-weight="900" font-size="20" letter-spacing="6" fill="#eafaff" filter="url(#glow)">OVERSEER</text>
  <rect x="228" y="15" width="156" height="22" rx="11" fill="none" stroke="#8cff3f" stroke-opacity=".5"/>
  <circle cx="242" cy="26" r="4" fill="#8cff3f" filter="url(#glow)"/>
  <text x="252" y="30" font-size="11" font-weight="700" fill="#8cff3f" letter-spacing="1.5">LIVE · BRIDGE #7</text>
