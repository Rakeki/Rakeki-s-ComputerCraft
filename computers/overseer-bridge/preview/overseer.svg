    <rect x="654" y="8" width="88" height="36" rx="6" fill="#0b1b2c" stroke="#3fe0ff" stroke-opacity=".2"/><text x="666" y="28" font-size="16" fill="#fff">17</text><text x="666" y="39" font-size="7" fill="#7d93ad" letter-spacing="2">TURTLES</text>
    <rect x="748" y="8" width="88" height="36" rx="6" fill="#0b1b2c" stroke="#3fe0ff" stroke-opacity=".2"/><text x="760" y="28" font-size="16" fill="#fff">12.4</text><text x="760" y="39" font-size="7" fill="#7d93ad" letter-spacing="2">MSG / S</text>
    <rect x="842" y="8" width="108" height="36" rx="6" fill="#0b1b2c" stroke="#ff4d5e" stroke-opacity=".4"/><text x="854" y="28" font-size="16" fill="#ff4d5e">1</text><text x="854" y="39" font-size="7" fill="#7d93ad" letter-spacing="2">ALERTS</text>
