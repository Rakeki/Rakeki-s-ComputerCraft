    <circle cx="470" cy="300" r="24" fill="url(#halo)"/><rect x="461" y="291" width="18" height="18" rx="4" fill="#040a14" stroke="#8cff3f"/><circle cx="470" cy="300" r="3" fill="#8cff3f"/>
