<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Consolas, 'JetBrains Mono', monospace">
  <title>The overseer page: a live map of every computer, with messages flying between them</title>
  <defs>
    <radialGradient id="bg" cx="40%" cy="40%" r="80%"><stop offset="0" stop-color="#0a1a2e"/><stop offset="1" stop-color="#03060c"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3fe0ff" stroke-opacity=".07"/></pattern>
    <pattern id="grid4" width="128" height="128" patternUnits="userSpaceOnUse"><path d="M128 0H0V128" fill="none" stroke="#3fe0ff" stroke-opacity=".16"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#8cff3f" stop-opacity=".45"/><stop offset="1" stop-color="#8cff3f" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloR"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".55"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloC"><stop offset="0" stop-color="#3fe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#3fe0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fe0ff" stop-opacity="0"/><stop offset="1" stop-color="#3fe0ff" stop-opacity=".16"/></linearGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#3fe0ff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ff3fd2"/></linearGradient>
  </defs>
  <rect width="960" height="540" fill="#04070d"/>

